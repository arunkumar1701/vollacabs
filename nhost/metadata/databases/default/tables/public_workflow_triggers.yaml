table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - &ref_1
                  _or:
                    - role:
                        _eq: owner
                    - role:
                        _eq: editor
      columns: &ref_0
        - id
        - workflow_id
        - type
        - config
        - enabled
        - created_at
      set: {}
update_permissions:
  - role: user
    permission:
      columns: *ref_0
      filter: &ref_2
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - *ref_1
      check: *ref_2
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - *ref_1
