table:
  name: workflow_outputs
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: public
    permission:
      columns: '*'
      filter: {}
  - role: user
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - id
        - workflow_id
        - workflow_run_id
        - step_run_id
        - org_id
        - data
        - created_at
      set: {}
update_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - workflow_run_id
        - step_run_id
        - org_id
        - data
        - created_at
      filter: {}
      check: {}
