table:
  name: workflow_notifications
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
event_triggers:
  - name: notify_dispatcher
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: http://host.docker.internal:3000/api/notifyWebhook
