table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - id
        - workflow_id
        - status
        - input
        - output
        - error
        - started_at
        - completed_at
        - created_at
      set: {}
update_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - status
        - input
        - output
        - error
        - started_at
        - completed_at
        - created_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
