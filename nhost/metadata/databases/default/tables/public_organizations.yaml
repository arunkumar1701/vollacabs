table:
  name: organizations
  schema: public
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns: &ref_0
        - id
        - name
        - quota_limit
        - quota_used
        - quota_period_start
        - created_at
      set: {}
update_permissions:
  - role: user
    permission:
      columns: *ref_0
      filter: &ref_1
        org_members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      check: *ref_1
